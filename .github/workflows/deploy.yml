name: Deploy to Hosting (noble.subhashkaler.com)

# Jab bhi is branch par code push hoga, files apne aap hosting par
# FTP se upload ho jayengi. Hostinger ka FTP kabhi-kabhi slow hota hai,
# isliye niche 3 baar tak apne aap retry hoti hai.
on:
  push:
    branches:
      - claude/echs-online-software-do3gb3
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 📤 Upload via FTP (try 1)
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:     ${{ secrets.FTP_SERVER }}
          username:   ${{ secrets.FTP_USERNAME }}
          password:   ${{ secrets.FTP_PASSWORD }}
          port:       21
          timeout:    600000
          server-dir: ${{ secrets.FTP_REMOTE_DIR || 'noble/' }}
          # Fresh sync state: the old state referenced folders (cron/, lib/)
          # that no longer exist on the server, and the action crashed with
          # "550 No such file or directory" while trying to delete them.
          # A new state name makes it upload everything and delete nothing.
          state-name: .noble-sync-v2.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
            **/DEPLOY.md
            **/.cpanel.yml
            config/secrets.php
            config/secrets.sample.php
            uploads/echs/**
            uploads/rghs/**

      - name: ⏳ Wait before retry 2
        if: steps.ftp1.outcome == 'failure'
        run: sleep 15

      - name: 📤 Upload via FTP (try 2)
        id: ftp2
        if: steps.ftp1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:     ${{ secrets.FTP_SERVER }}
          username:   ${{ secrets.FTP_USERNAME }}
          password:   ${{ secrets.FTP_PASSWORD }}
          port:       21
          timeout:    600000
          server-dir: ${{ secrets.FTP_REMOTE_DIR || 'noble/' }}
          state-name: .noble-sync-v2.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
            **/DEPLOY.md
            **/.cpanel.yml
            config/secrets.php
            config/secrets.sample.php
            uploads/echs/**
            uploads/rghs/**

      - name: ⏳ Wait before retry 3
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        run: sleep 25

      - name: 📤 Upload via FTP (try 3 - final)
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:     ${{ secrets.FTP_SERVER }}
          username:   ${{ secrets.FTP_USERNAME }}
          password:   ${{ secrets.FTP_PASSWORD }}
          port:       21
          timeout:    600000
          server-dir: ${{ secrets.FTP_REMOTE_DIR || 'noble/' }}
          state-name: .noble-sync-v2.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
            **/DEPLOY.md
            **/.cpanel.yml
            config/secrets.php
            config/secrets.sample.php
            uploads/echs/**
            uploads/rghs/**
